name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check .
      - name: Core tests
        run: pytest -q
      - name: Entry point tests (with AstrBot)
        if: matrix.python == '3.12'
        run: |
          pip install astrbot
          pytest -q tests/test_main.py
